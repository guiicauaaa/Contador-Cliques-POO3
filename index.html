<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Cliques</title>
    <link rel="stylesheet" href="./css/estilo.css">
</head>

<body>

    <main>
        <p>Contador de cliques</p>

        <!-- CONTADOR: o h1 começa em 0 e o JavaScript atualiza o texto -->
        <h1 aria-live="polite">0</h1>

        <!-- BOTÕES -->
        <div class="botoes">
            <button type="button" id="btnIncrementar">Incrementar</button>
            <button type="button" id="btnResetar">Resetar</button>
        </div>
    </main>

    <script src="./js/contador.js"></script>
</body>

</html>
